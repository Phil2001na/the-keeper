<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Work · Keeper</title>
<meta name="theme-color" content="#0b0714">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/app.css">
<script>
  /* Same pre-paint theme read as ui.html, so this page wears his colour from
     the first frame instead of flashing the default violet. */
  (function () {
    try {
      var t = JSON.parse(localStorage.getItem('keeper_theme') || '{}');
      var r = document.documentElement;
      if (t.h != null) r.style.setProperty('--h-base', t.h);
      if (t.spread != null) r.style.setProperty('--spread', t.spread);
      if (t.chroma != null) r.style.setProperty('--chroma', t.chroma);
      if (t.tint != null) r.style.setProperty('--tint', t.tint);
      if (t.glass != null) r.style.setProperty('--glass', t.glass);
      if (t.accentL) r.style.setProperty('--accent-l', t.accentL);
      if (t.onAccent) r.style.setProperty('--on-accent', t.onAccent);
      r.dataset.galaxy = t.galaxy === 'gargantua' ? 'gargantua' : 'deep';
      r.dataset.glass = (t.glass == null ? 42 : t.glass) > 6 ? 'on' : 'off';
    } catch (e) {
      document.documentElement.dataset.glass = 'on';
    }
  })();
</script>
<style>
  /* Work — the timeline of what got done and where it stopped. Built only from
     app.css tokens, so a hue change in Settings re-tunes this page as well. */
  html, body { height: auto; min-height: 100%; }
  .ws-shell { position: relative; z-index: 1; max-width: var(--shell); margin: 0 auto; min-height: 100dvh; }
  .ws-main { padding: 18px 16px calc(64px + env(safe-area-inset-bottom)); }

  .ws-back svg { transform: rotate(90deg); }
  .ws-sub { font-size: 12px; color: var(--text-faint); line-height: 1.3; }

  .glass {
    position: relative;
    border: 1px solid var(--line);
    border-top-color: var(--glass-rim);
    border-radius: var(--r-lg);
    background: linear-gradient(180deg, var(--glass-edge) 0%, transparent 30%),
      linear-gradient(168deg,
        oklch(calc(var(--glass-l) + 4%) var(--glass-c) var(--h) / var(--card-a)),
        oklch(var(--glass-l) var(--glass-c) var(--h) / var(--card-a)));
    box-shadow: var(--e-2);
  }
  [data-glass='on'] .glass { backdrop-filter: blur(var(--msg-blur)) saturate(var(--msg-sat)); -webkit-backdrop-filter: blur(var(--msg-blur)) saturate(var(--msg-sat)); }
  .rise { animation: cardmount var(--d-4) var(--ease) both; }

  /* ── controls ─────────────────────────────────────────────────────────── */
  .ws-tools { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; }
  .ws-search {
    flex: 1; min-width: 0; height: 40px; padding: 0 16px;
    border-radius: var(--r-full); border: 1px solid var(--line);
    background: color-mix(in oklab, var(--surface-1) 65%, transparent);
    outline: none; transition: border-color var(--d-2) var(--ease);
  }
  .ws-search:focus { border-color: var(--accent-line); }
  .ws-search::placeholder { color: var(--text-faint); }
  .seg { display: flex; padding: 3px; border-radius: var(--r-full); border: 1px solid var(--line); background: color-mix(in oklab, var(--surface-1) 65%, transparent); }
  .seg button { border: 0; background: none; cursor: pointer; padding: 6px 12px; border-radius: var(--r-full); font-size: 12.5px; color: var(--text-dim); transition: background var(--d-2) var(--ease), color var(--d-2) var(--ease); }
  .seg button[aria-pressed='true'] { background: var(--accent-soft); color: var(--accent-hi); }

  .eyebrow { font-size: 10.5px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent-hi); }
  .label { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-faint); margin: 26px 4px 10px; }

  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; padding: 2px 9px 2px 8px; border-radius: var(--r-full); border: 1px solid var(--line); color: var(--text-dim); white-space: nowrap; }
  .chip::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .chip.active { color: var(--accent-hi); border-color: var(--accent-line); }
  .chip.waiting { color: oklch(82% 0.13 80); border-color: oklch(82% 0.13 80 / 0.3); }
  .chip.parked { color: var(--text-faint); }
  .chip.done { color: var(--good); border-color: color-mix(in oklab, var(--good) 30%, transparent); }

  /* ── list ─────────────────────────────────────────────────────────────── */
  .area { padding: 6px; margin-bottom: 12px; overflow: hidden; }
  .row {
    display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center;
    width: 100%; padding: 13px 14px; border: 0; border-radius: var(--r-md);
    background: none; text-align: left; cursor: pointer; transition: background var(--d-2) var(--ease);
  }
  .row:hover { background: var(--accent-soft); }
  .row + .row { box-shadow: 0 -1px 0 var(--line-soft); }
  .row.child { padding-left: 30px; position: relative; }
  .row.child::before { content: ''; position: absolute; left: 16px; top: 0; bottom: 50%; width: 8px; border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); border-bottom-left-radius: 6px; }
  .row-title { font-size: 15.5px; font-weight: 560; letter-spacing: -0.01em; }
  .row.child .row-title { font-size: 14.5px; font-weight: 520; }
  .row-last { grid-column: 1 / -1; font-size: 13px; color: var(--text-dim); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row-last .when { color: var(--text-faint); }
  .row-meta { display: flex; gap: 8px; align-items: center; }
  .empty { text-align: center; color: var(--text-faint); padding: 48px 16px; font-size: 14px; }

  /* ── stream hero ──────────────────────────────────────────────────────── */
  .hero { padding: 22px 22px 20px; overflow: hidden; }
  .hero::before { content: ''; position: absolute; inset: 0 0 auto; height: 1px; background: linear-gradient(90deg, transparent, var(--accent), var(--accent-2), transparent); opacity: 0.75; }
  .hero h1 { font-size: 24px; font-weight: 640; letter-spacing: -0.02em; line-height: 1.2; margin: 8px 0 12px; }
  .hero .where { color: var(--text-dim); font-size: 14.5px; }
  .facts { display: grid; gap: 10px; margin: 16px 0 18px; }
  .fact { display: grid; grid-template-columns: 74px 1fr; gap: 12px; font-size: 14px; }
  .fact dt { color: var(--text-faint); font-size: 12px; padding-top: 2px; }
  .fact.next dd { color: var(--text); font-weight: 520; }
  .hero-actions { display: flex; gap: 8px; }
  .hero-actions .btn { width: auto; flex: 1; text-decoration: none; }
  .hero-actions .btn.quiet { flex: 0 0 auto; }
  .kids { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .kids button { font-size: 12.5px; padding: 6px 12px; border-radius: var(--r-full); border: 1px solid var(--line); background: none; cursor: pointer; color: var(--text-dim); }
  .kids button:hover { color: var(--accent-hi); border-color: var(--accent-line); }

  /* ── timeline ─────────────────────────────────────────────────────────── */
  .day { font-size: 12px; font-weight: 600; color: var(--text-faint); margin: 22px 0 6px 64px; letter-spacing: 0.02em; }
  .tl { position: relative; }
  .ev { display: grid; grid-template-columns: 48px 16px 1fr; gap: 0 10px; animation: mount var(--d-3) var(--ease) both; }
  .ev time { font-size: 12px; color: var(--text-faint); text-align: right; padding-top: 15px; font-variant-numeric: tabular-nums; }
  .rail { position: relative; }
  .rail::before { content: ''; position: absolute; left: 7px; top: 0; bottom: 0; width: 1.5px; background: var(--line); }
  .ev.first .rail::before { top: 20px; }
  .ev.last .rail::before { bottom: calc(100% - 20px); }
  .ev.first.last .rail::before { display: none; }
  .rail i { position: absolute; left: 2px; top: 14px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 2px solid var(--text-faint); }
  .ev.done .rail i { border-color: var(--good); background: color-mix(in oklab, var(--good) 35%, var(--bg)); }
  .ev.stopped .rail i { border-color: oklch(82% 0.13 80); }
  .ev.info .rail i { border-color: var(--accent); }
  .ev-body { min-width: 0; padding: 4px 0; }
  .ev-head { display: block; width: 100%; text-align: left; border: 0; background: none; cursor: pointer; padding: 8px 12px 10px; margin-left: -12px; border-radius: var(--r-md); transition: background var(--d-2) var(--ease); }
  .ev-head:hover { background: var(--accent-soft); }
  .what { font-size: 14.5px; line-height: 1.45; color: var(--text); }
  .stop { display: flex; gap: 7px; margin-top: 4px; font-size: 13px; color: oklch(84% 0.1 80); line-height: 1.4; }
  .stop::before { content: '↳'; color: var(--text-faint); }
  .ev.done .stop { color: var(--text-dim); }
  .who { font-size: 11.5px; color: var(--text-faint); margin-top: 5px; }
  .ev.open .ev-head { background: var(--accent-soft); }
  .detail { margin: 6px 0 12px -12px; padding: 16px 18px; font-size: 14px; color: var(--text-dim); overflow-wrap: anywhere; }
  .detail p + p, .detail ul + p, .detail p + ul { margin-top: 10px; }
  .detail ul { padding-left: 18px; }
  .detail b { color: var(--text); font-weight: 600; }
  .detail a { color: var(--accent-hi); }
  .detail-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line-soft); font-size: 12px; color: var(--text-faint); }
  .linkish { border: 0; background: none; cursor: pointer; color: var(--accent-hi); font-size: 12px; padding: 0; }
  .muted-block { margin-top: 12px; }

  /* ── forms ────────────────────────────────────────────────────────────── */
  .form { display: grid; gap: 12px; margin-top: 14px; }
  .form label { display: grid; gap: 5px; font-size: 12px; color: var(--text-faint); }
  .form input, .form textarea, .form select {
    width: 100%; padding: 10px 12px; border-radius: var(--r-sm); border: 1px solid var(--line);
    background: color-mix(in oklab, var(--surface-1) 70%, transparent); color: var(--text); font-size: 14px; outline: none;
  }
  .form textarea { min-height: 72px; resize: vertical; line-height: 1.5; }
  .form input:focus, .form textarea:focus, .form select:focus { border-color: var(--accent-line); }
  .form .btn { width: auto; justify-self: start; padding: 10px 18px; }
  .note { padding: 14px; margin-top: 18px; }
  .note textarea { min-height: 48px; }

  #toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0; z-index: 10; padding: 9px 16px; border-radius: var(--r-full); font-size: 13px; pointer-events: none; transition: opacity var(--d-3) var(--ease), transform var(--d-3) var(--ease); }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #toast.err { color: var(--bad); }

  @media (max-width: 520px) {
    .ws-main { padding-inline: 12px; }
    .ev { grid-template-columns: 40px 16px 1fr; gap: 0 8px; }
    .day { margin-left: 52px; }
    .hero { padding: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .rise, .ev { animation: none; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12Z"/></symbol>
</svg>

<div class="field" aria-hidden="true">
  <span class="galaxy"></span>
  <span class="bloom b1"></span>
  <span class="bloom b2"></span>
  <span class="bloom b3"></span>
  <span class="bloom b4"></span>
  <span class="bloom b5"></span>
</div>

<div class="ws-shell">
  <header>
    <a class="icon-btn ws-back" id="back" href="/" title="Back" aria-label="Back"><svg><use href="#i-chevron-down"/></svg></a>
    <div class="head-text">
      <div class="title" id="title">WORK</div>
      <div class="ws-sub" id="sub">&nbsp;</div>
    </div>
    <button class="icon-btn" id="newbtn" title="New workstream" aria-label="New workstream"><svg><use href="#i-plus"/></svg></button>
  </header>
  <main class="ws-main" id="content" aria-live="polite"></main>
</div>
<div id="toast" class="glass" role="status"></div>

<script src="/workstreams.js" defer></script>
</body>
</html>
