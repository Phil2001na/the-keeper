<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Workstreams · Keeper</title><link rel="stylesheet" href="/app.css"><style>
body{overflow:auto!important;height:auto!important;background:var(--bg,#101015);color:var(--text,#eee)}.ws{max-width:900px;margin:auto;padding:24px 20px 80px}.ws header{position:static;display:flex;justify-content:space-between;gap:16px;padding:0 0 22px}.ws h1{font-size:26px}.ws h2{font-size:20px;margin:16px 0}.ws p,.ws small{line-height:1.6}.ws input,.ws textarea,.ws select,.ws button,.ws a{font:inherit}.ws input,.ws textarea,.ws select{width:100%;padding:12px;background:var(--surface,rgba(128,128,128,.12));color:inherit;border:1px solid var(--border,#666);border-radius:10px}.ws textarea{min-height:80px;resize:vertical}.ws button,.ws .link{display:inline-block;padding:11px 14px;min-height:44px;border:1px solid #7776;border-radius:12px;background:transparent;color:inherit;cursor:pointer;text-decoration:none}.ws label{display:block;margin:10px 0}.ws article,.ws .panel{border:1px solid #7775;border-radius:18px;padding:18px;margin:14px 0;background:#88888808}.ws .list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.ws .list button{text-align:left;display:block;width:100%}.ws .list small{display:block}.ws .muted{opacity:.7}.ws .error{color:#ffb5a8;white-space:pre-wrap}.ws .trail{white-space:pre-wrap;overflow-wrap:anywhere}.ws .actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.ws details{margin:14px 0}.ws summary{cursor:pointer;padding:8px 0}.ws pre{white-space:pre-wrap;overflow-wrap:anywhere}.ws :focus-visible{outline:2px solid var(--accent,#bcbcff);outline-offset:3px}#notice{position:sticky;top:0;background:#202028;padding:8px;border-radius:8px;z-index:3}#notice:empty{display:none}</style></head><body><main class="ws"><header><div><h1>Workstreams</h1><p class="muted">Pick up where you left off.</p></div><a class="link" href="/">Back to chat</a></header><div id="notice" role="status"></div><div id="error" role="alert" class="error"></div><div id="content">Loading your work…</div></main><script src="/workstreams.js" defer></script></body></html>
